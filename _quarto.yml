project:
  type: website
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "!CLAUDE.md"
    # Borradores locales (gitignorados): no forman parte del sitio
    - "!lecturas_nuevas/"
    - "!propuestas/"
  resources:
    - images/**

website:
  title: "Jorge Juvenal Campos Ferreira"
  description: "Ciencia de datos · Periodismo de datos · Docencia"

  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Inicio
      - href: posts.qmd
        text: Blog
      - href: about.qmd
        text: Sobre mí
      - href: index.qmd#contacto
        text: Contacto
    right:
      - icon: github
        href: https://github.com/JuveCampos
        aria-label: GitHub
      - icon: twitter
        href: https://twitter.com/JuvenalCamposF
        aria-label: Twitter
      - icon: bluesky
        href: https://bsky.app/profile/juvenalcamposf.bsky.social
        aria-label: Bluesky
      - icon: linkedin
        href: https://www.linkedin.com/in/jorge-juvenal-campos-ferreira-5532b7160/
        aria-label: LinkedIn
      - icon: instagram
        href: https://www.instagram.com/juvenalcampos.dataviz/
        aria-label: Instagram

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header:
      - includes/in-header.html
    include-after-body:
      - includes/after-body.html
    toc: true
    code-fold: false
    highlight-style: github
    lang: es

execute:
  freeze: auto
